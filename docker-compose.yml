services:
  maxgraph:
    image: ghcr.io/rumemory/maxgraph:${MG_VERSION:-latest}
    build: .
    container_name: maxgraph
    restart: unless-stopped
    ports:

      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data



      - ${HOSTFP_PATH:-./hostfp.json}:/app/hostfp.json:ro
    env_file:
      - path: store.env
        required: false
    environment:
      MEMORY_TOKEN: ${MEMORY_TOKEN:-}
      HOST_FP: ${HOST_FP:-}
      INSTALL_FLAVOR: ${INSTALL_FLAVOR:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      READONLY: ${READONLY:-}

      EMBED_URL: ${EMBED_URL:-}
      EMBED_KEY: ${EMBED_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_TIMEOUT: ${EMBED_TIMEOUT:-}
      EMBED_REFRESH_SEC: ${EMBED_REFRESH_SEC:-}
      EMBED_DAILY_CAP: ${EMBED_DAILY_CAP:-}
      HYBRID_VECTOR_WEIGHT: ${HYBRID_VECTOR_WEIGHT:-}

      ACTR_FLUSH_SEC: ${ACTR_FLUSH_SEC:-}
      ACTR_MAX_BOOST: ${ACTR_MAX_BOOST:-}
      ACTR_HALF_LIFE_DAYS: ${ACTR_HALF_LIFE_DAYS:-}





  updater:
    build: ./services/updater
    container_name: maxgraph-updater
    restart: unless-stopped
    depends_on:
      - maxgraph
    environment:
      AUTO_UPDATE: ${AUTO_UPDATE:-1}
      STORE_URL: ${STORE_URL:-}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-}
      TARGET_CONTAINER: ${TARGET_CONTAINER:-maxgraph}
      SELF_CONTAINER: ${SELF_CONTAINER:-maxgraph-updater}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-state:/state
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  updater-state:
