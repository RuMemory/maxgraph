services:
  maxgraph:
    build: .
    container_name: maxgraph
    restart: unless-stopped
    ports:
      # Только localhost: снаружи ходит nginx → 127.0.0.1:8787
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    environment:
      MEMORY_TOKEN: ${MEMORY_TOKEN:-}  # пусто → автогенерация mg_local_* в data/local_token.txt (v0.14)
      HOST_FP: ${HOST_FP:-}  # sha256 железа хоста (ставит установщик; стабильный fingerprint машины)
      INSTALL_FLAVOR: ${INSTALL_FLAVOR:-}  # docker|rancher|python — ставит установщик; метка в install-ping (v0.39.0)
      STORE_MODE: ${STORE_MODE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PLATEGA_MERCHANT_ID: ${PLATEGA_MERCHANT_ID:-}
      PLATEGA_API_KEY: ${PLATEGA_API_KEY:-}
      PLATEGA_WEBHOOK_SECRET: ${PLATEGA_WEBHOOK_SECRET:-}
      PLATEGA_API_BASE: ${PLATEGA_API_BASE:-}
      PLATEGA_CURRENCY: ${PLATEGA_CURRENCY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-}
      LICENSE_HMAC_SECRET: ${LICENSE_HMAC_SECRET:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      DIGISELLER_GEN_SECRET: ${DIGISELLER_GEN_SECRET:-}
      DIGISELLER_PRODUCT_ID: ${DIGISELLER_PRODUCT_ID:-}
      DIGISELLER_SIGN_SCHEME: ${DIGISELLER_SIGN_SCHEME:-}
      DIGISELLER_RESPONSE_FORMAT: ${DIGISELLER_RESPONSE_FORMAT:-}
      DIGISELLER_HOOK_SECRET: ${DIGISELLER_HOOK_SECRET:-}
      TG_NOTIFY_CHAT_ID: ${TG_NOTIFY_CHAT_ID:-}
      GITHUB_HOOK_SECRET: ${GITHUB_HOOK_SECRET:-}  # v0.33.0: вебхук витрины → TG (только магазин)
      REF_HMAC_SECRET: ${REF_HMAC_SECRET:-}  # v0.38.0: деривация реф-кодов (только магазин; смена = новые коды!)
      READONLY: ${READONLY:-}
      # В2.2: опциональный семантический поиск (без URL/KEY — чистый FTS 0.14.x)
      EMBED_URL: ${EMBED_URL:-}
      EMBED_KEY: ${EMBED_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_TIMEOUT: ${EMBED_TIMEOUT:-}
      EMBED_REFRESH_SEC: ${EMBED_REFRESH_SEC:-}
      EMBED_DAILY_CAP: ${EMBED_DAILY_CAP:-}
      HYBRID_VECTOR_WEIGHT: ${HYBRID_VECTOR_WEIGHT:-}
      # В2.3: ACT-R reinforcement (default ON; ACTR_MAX_BOOST=0 — выкл.)
      ACTR_FLUSH_SEC: ${ACTR_FLUSH_SEC:-}
      ACTR_MAX_BOOST: ${ACTR_MAX_BOOST:-}
      ACTR_HALF_LIFE_DAYS: ${ACTR_HALF_LIFE_DAYS:-}

  # v0.20.0: sidecar автообновлений (v0.22.0 — watchtower-style, кросс-ОС:
  # Docker Desktop Windows/macOS и Linux). Раз в час сверяет версию с
  # магазином (дефолт CHECK_INTERVAL=3600, v0.32.2); новый релиз: tarball + sha256 + ed25519-подпись, бэкап data/,
  # сборка образа из tarball'а, clone-recreate контейнера, откат при провале
  # healthcheck. ВЫКЛ: AUTO_UPDATE=0 в .env.
  # NB: доступ к docker socket = контроль над Docker хоста (как у watchtower).
  updater:
    build: ./services/updater
    container_name: maxgraph-updater
    restart: unless-stopped
    depends_on:
      - maxgraph
    environment:
      AUTO_UPDATE: ${AUTO_UPDATE:-1}
      STORE_URL: ${STORE_URL:-}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-}  # дефолт 3600с (v0.32.2); floor 300с в updater.sh
      TARGET_CONTAINER: ${TARGET_CONTAINER:-maxgraph}
      SELF_CONTAINER: ${SELF_CONTAINER:-maxgraph-updater}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-state:/state  # update_state.json + бэкапы data/ (ротация 5;
                              # NB: бэкапы содержат секреты приложения — ротируй
                              # токены с учётом того, что старые живут в бэкапах)
    # Бесплатное сужение пост-компрометации (socket и так = root на хосте;
    # read_only НЕ включаем: сборка tarball'а в /tmp требует места — tmpfs
    # пришлось бы размерить под 256MB кап, риск на слабых хостах).
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  updater-state:
