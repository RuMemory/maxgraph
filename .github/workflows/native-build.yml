name: Native client binaries









on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}


    if: github.repository == 'RuMemory/maxgraph'
    strategy:
      fail-fast: false
      matrix:
        include:

          - { runs-on: windows-latest, target: windows-amd64, ext: ".exe" }
          - { runs-on: macos-latest,   target: macos-arm64,   ext: "" }
          - { runs-on: ubuntu-latest,  target: linux-amd64,   ext: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      - name: Version guard (tag == VERSION)
        shell: bash
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          [ -n "$VER" ] || { echo "FATAL: VERSION пуст"; exit 1; }
          [ "v$VER" = "$GITHUB_REF_NAME" ] \
            || { echo "FATAL: тег $GITHUB_REF_NAME != VERSION ($VER)"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "ART=maxgraph-${VER}-${{ matrix.target }}${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Install build deps
        run: pip install pyinstaller "mcp>=1.14.0,<2.0" "uvicorn>=0.30" "pydantic>=2.7" pystray pillow





      - name: PyInstaller build (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""
          for f in VERSION app/dashboard.html app/privacy.html app/offer.html \
                   app/landing.html app/billing.html app/og.png app/favicon.ico \
                   app/release.pub.pem; do
            [ -f "$f" ] && ARGS="$ARGS --add-data $f:."
          done
          [ -d app/static ] && ARGS="$ARGS --add-data app/static:static"
          # иконка трея (assets/): в exe — _MEIPASS/assets/, как в исходниках
          [ -f app/assets/tray-icon.png ] && ARGS="$ARGS --add-data app/assets/tray-icon.png:assets"
          # иконка exe: .lnk-ярлыки (IconLocation=exe) берут её из ресурсов
          [ -f build/maxgraph.ico ] && ARGS="$ARGS --icon build/maxgraph.ico"
          echo "add-data: $ARGS"
          # update_popup: импортируется из native.py лениво (внутри функций) —
          # modulegraph подхватит, но страхуемся явным hidden-import
          pyinstaller -y --onefile --name maxgraph --paths app \
            --hidden-import update_popup $ARGS app/app.py
          mv "dist/maxgraph" "dist/$ART"

      - name: PyInstaller build (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pyArgs = @()
          foreach ($f in @('VERSION','app/dashboard.html','app/privacy.html','app/offer.html',
                           'app/landing.html','app/billing.html','app/og.png','app/favicon.ico',
                           'app/release.pub.pem')) {
            if (Test-Path $f) { $pyArgs += @('--add-data', "$f;.") }
          }
          if (Test-Path app/static) { $pyArgs += @('--add-data', 'app/static;static') }
          # иконка трея (assets/): в exe — _MEIPASS/assets/, как в исходниках
          if (Test-Path app/assets/tray-icon.png) { $pyArgs += @('--add-data', 'app/assets/tray-icon.png;assets') }
          # иконка exe: .lnk-ярлыки (IconLocation=exe) берут её из ресурсов
          if (Test-Path build/maxgraph.ico) { $pyArgs += @('--icon', 'build/maxgraph.ico') }
          Write-Host "add-data: $pyArgs"
          # --windowed: без консольного окна ни при автозапуске, ни при обновлении
          # (кейс покупателя 1.0.1: кнопка обновления открывала консоль helper'а).
          # Логи helper'а идут в data/update.log (FileHandler), stdout не нужен.
          # На unix НЕ добавляем: macOS onefile+windowed собирает .app-бандл и
          # ломает контракт dist/maxgraph (smoke + mv), а окна там и так нет.
          # update_popup: импортируется из native.py лениво (внутри функций) —
          # modulegraph подхватит, но страхуемся явным hidden-import
          pyinstaller -y --onefile --windowed --name maxgraph --paths app `
            --hidden-import update_popup @pyArgs app/app.py
          Move-Item dist/maxgraph.exe "dist/$env:ART"


      - name: Smoke (exists, >10MB)
        shell: bash
        run: |
          [ -f "dist/$ART" ] || { echo "FATAL: dist/$ART не собран"; exit 1; }
          SIZE=$(stat -c%s "dist/$ART" 2>/dev/null || stat -f%z "dist/$ART")
          echo "size: $SIZE bytes"
          [ "$SIZE" -gt 10485760 ] || { echo "FATAL: подозрительно маленький бинарь"; exit 1; }


      - name: Upload to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "dist/$ART" \
            --repo "${{ github.repository }}" --clobber
